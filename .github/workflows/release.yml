# A tag builds the release, not a laptop.
#
# Until v0.13.0 the four static binaries were built on the operator's machine and uploaded
# by hand, and the startup script of the gateway VM pins the gateway by version and
# sha256. A build nobody can repeat is a checksum nobody can check against a source, so
# the release is cut here, on a runner, from the tagged commit, the same way every
# project's tests run on a runner and not on the machine of whoever wrote the change.
#
# Cutting one: `git tag -a v0.13.1 -m ... && git push origin v0.13.1`. Then pin the sha
# of control-gateway-linux-amd64 from SHA256SUMS in deploy/gcp/startup.sh and carry it
# with `deploy/gcp/rehearse.sh upgrade`.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - name: Static Linux builds
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          for cmd in gateway anchor verify relying; do
            go build -trimpath -ldflags='-s -w' -o "dist/control-${cmd}-linux-amd64" "./cmd/${cmd}"
          done
          (cd dist && sha256sum control-*-linux-amd64 > SHA256SUMS && cat SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/control-*-linux-amd64 dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" --notes "Static Linux builds, CGO_ENABLED=0 -trimpath, built on a runner from ${GITHUB_SHA}. Checksums in SHA256SUMS."
